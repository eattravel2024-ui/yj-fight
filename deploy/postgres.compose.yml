# Optional, manually started PostgreSQL for this game only. Never invoked by
# install/upgrade scripts. Keep the credentials file outside the repository.
name: azhi-db
services:
  postgres:
    image: postgres:17-bookworm
    container_name: azhi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: azhi_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the private database administrator password}
      AZHI_DB_PASSWORD: ${AZHI_DB_PASSWORD:?Set a different password for the non-superuser game role}
    ports:
      - "127.0.0.1:${AZHI_DB_BIND_PORT:-15432}:5432"
    volumes:
      - azhi-db-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/010-azhi.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azhi_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  azhi-db-data:
    name: azhi-db-data
