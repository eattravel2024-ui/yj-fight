name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax validation
        run: npm run check
      - name: Tests
        run: npm test
      - name: Deployment script syntax
        run: bash -n deploy/*.sh
      - name: Install browser for end-to-end tests
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Real browser gameplay and mobile smoke tests
        if: matrix.node == 24
        run: npm run test:e2e
